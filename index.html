<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:#594438;font-family:"Nunito","Quicksand","PingFang TC","Noto Sans TC","Microsoft JhengHei",ui-rounded,system-ui,sans-serif;background:#e9dfcf}
body{background:radial-gradient(circle at 15% 5%,#f8efe1 0,#eee3d3 48%,#dfd2bf 100%)}
#app{max-width:480px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#fbf6ec;position:relative;padding:0 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 0 30px #6b4a2620;border-left:1px solid #ffffff80;border-right:1px solid #ffffff80}
#top{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 14px 6px;font-weight:800;font-size:13px;gap:5px;color:#624936}
#top>span:not(:last-child){background:#fffdf7;border:1px solid #eadcc8;border-radius:999px;padding:6px 10px;box-shadow:0 2px 0 #e8ddcc;white-space:nowrap}
#top button{padding:5px 10px;font-size:15px;box-shadow:0 2px 0 #7f8e68}
#scene{flex:none;position:relative;width:min(calc(100% - 24px),42vh);width:min(calc(100% - 24px),42dvh);margin:4px auto 0;aspect-ratio:3/2;overflow:hidden;border-radius:17px;background:#ead9bd;box-shadow:0 0 0 4px #fffdf7,0 7px 0 4px #d9c7a9,0 12px 22px #61472b20}
#cafeScene{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#cust{flex:none;position:relative;margin:14px 14px 8px;padding:6px 12px;background:#fffdf8;border:2px solid #d9c9ae;border-radius:15px;box-shadow:0 3px 0 #e8dece}
#cust:before{content:"";position:absolute;top:-9px;left:38px;width:13px;height:13px;background:#fffdf8;border-left:2px solid #d9c9ae;border-top:2px solid #d9c9ae;transform:rotate(45deg)}
#ty{font-size:12px;color:#9a7651;font-weight:800;letter-spacing:.02em}
#bub{font-size:14.5px;line-height:1.35;min-height:38px;font-weight:750;color:#594438}
#hint{color:#9c8873;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 4px}
#pn{flex:1 1 auto;min-height:0;overflow-y:auto;padding-top:2px}
.o.pk{text-align:center;white-space:nowrap;text-overflow:ellipsis}
.o.bd.on{background:#c96d57;border-color:#aa5645;box-shadow:0 2px 0 #984a3b}
#pk{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:72%;overflow-y:auto;background:#fffdf8;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px #61472b40;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
#pk h4{margin:0 0 8px;color:#9a7651;font-size:13px}
#pk .g{display:flex;flex-wrap:wrap;gap:6px}
#pk .o{min-height:40px}
.o{flex:1 1 22%;min-height:32px;font-size:12px;font-weight:750;padding:2px 3px;border-radius:11px;background:#fffdf8;color:#5c493b;border:1.5px solid #d9c9ae;box-shadow:0 2px 0 #d9c9ae;line-height:1.15;overflow:hidden;font-family:inherit}
.o small{display:block;font-size:10px;color:#a28d76;font-weight:600}
.o:active{transform:translateY(2px);box-shadow:0 0 0 #d9c9ae}
.o.on{background:linear-gradient(#829b70,#6f895f);color:#fff;border-color:#607d52;box-shadow:0 2px 0 #536d47}
.o.on small{color:#f4f2e9}
.row.bad .o.on{background:#c96d57;border-color:#aa5645;box-shadow:0 2px 0 #984a3b}
button{border:0;border-radius:999px;background:linear-gradient(#8da77b,#718d60);color:#fff;font-size:18px;font-weight:800;padding:12px 26px;font-family:inherit;box-shadow:0 4px 0 #536f47}
button.s{background:linear-gradient(#bd9c70,#a98255);box-shadow:0 3px 0 #896744}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #536f47}
button:disabled{opacity:.45}
#sv{flex:none;display:block;width:calc(100% - 28px);margin:6px 14px 0;padding:10px 26px;background:linear-gradient(#d58b61,#bd704b);box-shadow:0 4px 0 #97563b,0 8px 18px #61472b40;font-size:19px;letter-spacing:.02em}
.b{font-size:14px;padding:6px 14px}
.ov{position:absolute;inset:0;background:#f7f0e5f7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;z-index:5;min-height:100%;overflow-y:auto;backdrop-filter:blur(4px)}
.ov.top{justify-content:flex-start}
.hide{display:none!important}
h1{margin:0;font-size:30px;color:#70865d;text-shadow:0 2px 0 #fff}
h3{margin:12px 0 4px;color:#9a7651;text-align:left;width:100%}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:6px 4px;border-bottom:1px dashed #ddcdb6;font-size:15px;text-align:left}
.w{width:100%}
small{color:#9c8873}
#fl{position:fixed;left:0;right:0;top:35%;text-align:center;font-size:28px;font-weight:900;pointer-events:none;-webkit-text-stroke:5px #fffdf7;paint-order:stroke fill;z-index:9}

@keyframes nod{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(7deg)}72%{transform:rotate(-1deg)}78%{transform:rotate(6deg)}86%{transform:rotate(0)}}
@keyframes smile{0%,58%,100%{transform:scale(1)}66%,84%{transform:scale(1.55,1.7)}}
@keyframes blush{0%,58%,100%{opacity:0}66%,84%{opacity:.55}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bh{transform-box:fill-box;transform-origin:50% 100%;animation:nod 6s ease-in-out infinite}
.bm{transform-box:fill-box;transform-origin:50% 0;animation:smile 6s ease-in-out infinite}
.bc{animation:blush 6s ease-in-out infinite}
.be{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}
</style></head>

  lastSum=`<h1>第 ${n} 天結束</h1><div>服務 ${served} 位　離開 ${lost} 位</div><div>今日淨收入 💰 <b>${dayC}</b>　存款 💰 <b>${C}</b></div>${penD?'<div>😠 客人氣走扣款 <b>−'+penD+'</b></div>':''}${ms?'<h3>這天答錯的單字（之後會更常出現）</h3><div class=w>'+ms+'</div>':''}<button onclick="startDay()">繼續 第 ${day} 天</button><button class="s" onclick="shop('sum()')">🛒 商店</button><button class="s" onclick="menu()">回選單</button>`;
  sum();
}
const sum=()=>show(lastSum,1);
const RT={size:'Size',drink:'Drink',milk:'Milk',syrup:'Syrup',ex:'Extras',food:'Food',misc:'Add-ons'};
let pkRow=null;
const isOn=(c,r,v)=>Array.isArray(c.sel[r])?c.sel[r].includes(v):c.sel[r]==v;
const optBtn=(c,r,v)=>`<button class="o${isOn(c,r,v)?' on':''}" data-r="${r}" data-v="${v}">${W[r][v][0]}</button>`;
function pkBtn(c,r){const v=c.sel[r],on=Array.isArray(v)?v.length>0:(v&&v!=='none'),t=Array.isArray(v)?v.map(x=>W[r][x][0]).join(' + '):(v?W[r][v][0]:'');return `<button class="o pk${on?' on':''}${bad.includes(r)?' bd':''}" data-pk="${r}" style="flex:1 1 30%">${on?t:RT[r]} ▾</button>`}
function drawPanel(c,coll){
  let h='',grp='';
  const flush=()=>{if(grp){h+=`<div class="row">${grp}</div>`;grp=''}};
  Object.keys(RN).forEach(r=>{const a=avail(r);if(!a.length)return;
    if(coll.has(r))grp+=pkBtn(c,r);
    else{flush();h+=`<div class="row${bad.includes(r)?' bad':''}">`+a.map(v=>optBtn(c,r,v)).join('')+'</div>'}});
  flush();return h;
}
function panel(){
  const c=cs.find(c=>c.id==selId),pn=$('pn'),coll=new Set();
  if(!c){pn.innerHTML='';return}
  pn.innerHTML=drawPanel(c,coll);
  for(let g2=0;g2<8&&pn.scrollHeight>pn.clientHeight+1;g2++){
    const cd=n=>Object.keys(RN).filter(r=>!coll.has(r)&&avail(r).length>n).sort((x,y)=>avail(y).length-avail(x).length)[0],k=cd(4)||cd(2);
    if(!k)break;coll.add(k);pn.innerHTML=drawPanel(c,coll);
  }
}
function renderPk(){
  const c=cs.find(c=>c.id==selId),el=$('pk');
  if(!c||!pkRow){el.classList.add('hide');pkRow=null;return}
  el.innerHTML=`<h4>${RT[pkRow]}</h4><div class="g">${avail(pkRow).map(v=>optBtn(c,pkRow,v)).join('')}</div>`+(Array.isArray(c.sel[pkRow])?'<button id="pkd" style="margin-top:10px;width:100%">Done ✔</button>':'');
  el.classList.remove('hide');
}
function setOpt(r,v){
  const c=cs.find(c=>c.id==selId);if(!run||!c)return;
  const s2=c.sel;
  if(Array.isArray(s2[r])){const i=s2[r].indexOf(v);i<0?s2[r].push(v):s2[r].splice(i,1)}else{s2[r]=v;if(pkRow===r)pkRow=null}
  vib(8);panel();renderPk();
}
function hud(){
  $('d').textContent='第 '+day+' 天'+(TEST?' 🧪':'');$('t').textContent='⏱ '+Math.max(0,Math.ceil(T));$('c').textContent='💰 '+C;
  const c=cs.find(c=>c.id==selId);

  $('hint').textContent=c&&hint?'💡 '+c.zh:'';
}
const fx=[];
function rr(x,y,w,h,r,f,k){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fillStyle=f;g.fill();if(k){g.strokeStyle=k;g.lineWidth=2;g.stroke()}}
const PAL=[['#6f8c65','#d58e68','#514238'],['#b97854','#f0c29c','#493b36'],['#7896a1','#e1b28e','#624b42'],['#a17eaa','#edc39f','#443b39'],['#c28c4e','#d99e79','#534239'],['#8b9b72','#f0c5a0','#59463b']];
const CUSH=['#7f9a6c','#d58b61','#c9a24f'];
function ln(x1,y1,x2,y2,col,w){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function hairDo(st,col){
  g.fillStyle=col;g.beginPath();
  if(st==4){g.moveTo(-8.6,0);g.quadraticCurveTo(-9,-11.5,1,-11);g.quadraticCurveTo(9.5,-10,8.6,0);g.quadraticCurveTo(4,-4,-3,-6);g.quadraticCurveTo(-6,-3,-8.6,0)}
  else{g.moveTo(-8.6,0);g.quadraticCurveTo(-9,-11.5,0,-11);g.quadraticCurveTo(9,-11.5,8.6,0);g.quadraticCurveTo(6.5,-5.5,1,-6.5);g.quadraticCurveTo(-4,-5.5,-8.6,0)}
  g.closePath();g.fill();
  if(st==1){rr(-9.4,-3,3.6,12,1.8,col);rr(5.8,-3,3.6,12,1.8,col)}
  if(st==2){g.beginPath();g.arc(0,-12.6,4.2,0,7);g.fill()}
  if(st==3){for(let i=-2;i<=2;i++){g.beginPath();g.arc(i*3.7,-9+Math.abs(i)*1.3,4.2,0,7);g.fill()}}
  if(st==5){g.save();g.translate(9.4,-1);g.rotate(.35);g.beginPath();g.ellipse(0,3,2.8,5.5,0,0,7);g.fill();g.restore()}
}
function cup(x,y,ice){
  if(ice){rr(x-2.6,y-6,5.2,7.5,1.5,'#e3f3f3','#8fb7bb');ln(x+.5,y-6,x+1.8,y-10,'#cf7764',1)}
  else{rr(x-2.8,y-5,5.6,6.5,1.5,'#fbf3e4','#a98562');rr(x-2.8,y-3.2,5.6,2.8,0,'#b8734c');rr(x-3.2,y-6.4,6.4,2,1,'#6f8c65')}
}
function drawC(c){
  const [coat,skin,hairC]=PAL[(c.id-1)%6],hs=(c.id*7+c.id%3)%6,sit=c.st==='sit',mv=c.st==='in'||c.st==='toSeat'||c.st==='out';
  const dir=c.dir||1,ph=tm*13+c.id,sw=mv?Math.sin(ph)*3.4:0,q=c.st==='wait'?c.pat/c.pm:1;
  const y=c.y+(c.by||0),dark='#5b432e';
  g.save();g.translate(c.x,y);
  g.globalAlpha=.2;g.fillStyle=dark;g.beginPath();g.ellipse(0,(sit?2:1.5)-(c.by||0),sit?12:11,3.5,0,0,7);g.fill();g.globalAlpha=1;
  const T=c.t,ty=sit?-23:-27,hy=sit?-31:-34,by=sit?-2:-11;
  if(T==='tour'){rr(dir>0?3:-12,ty+2,9,by-ty-3,3,'#b97a4c',dark)}
  if(!sit){ // legs + shoes
    ln(-3.2,-11,-3.2+sw,-1,'#55483e',5);ln(3.2,-11,3.2-sw,-1,'#55483e',5);
    g.fillStyle='#f7ead7';g.strokeStyle=dark;g.lineWidth=.8;
    [[-3.2+sw,0],[3.2-sw,0]].forEach(([fx2,fy])=>{g.beginPath();g.ellipse(fx2+dir*1,fy+.8,4.2,2.3,0,0,7);g.fill();g.stroke()});
  }
  // torso
  g.fillStyle=coat;g.strokeStyle=dark;g.lineWidth=1;g.beginPath();
  g.moveTo(-8.4,ty+3);g.quadraticCurveTo(-8.6,ty-.5,-4.5,ty);g.lineTo(4.5,ty);g.quadraticCurveTo(8.6,ty-.5,8.4,ty+3);g.lineTo(7.4,by);g.quadraticCurveTo(0,by+3,-7.4,by);g.closePath();g.fill();g.stroke();
  g.globalAlpha=.1;g.fillStyle='#000';g.beginPath();g.moveTo(1.5,ty);g.lineTo(4.5,ty);g.quadraticCurveTo(8.6,ty-.5,8.4,ty+3);g.lineTo(7.4,by);g.quadraticCurveTo(3,by+2,1.5,by+2);g.closePath();g.fill();g.globalAlpha=1;
  ln(0,ty+3,0,by-1,'#ffffff55',1);
  g.fillStyle='#4d3b30';g.fillRect(-7.4,by-2.5,14.8,2.2);
  if(T==='rush'){g.fillStyle='#c96d57';g.beginPath();g.moveTo(0,ty+.5);g.lineTo(2.3,ty+4);g.lineTo(0,by-3);g.lineTo(-2.3,ty+4);g.closePath();g.fill()}
  if(T==='reg'){rr(-8.6,ty-2.8,17.2,4.4,2.2,'#d9b45a',dark);rr(dir>0?3:-6,ty+1,3.6,8,1.6,'#c79d44')}
  // collar + neck
  g.fillStyle=skin;g.fillRect(-2.2,ty-4,4.4,4.5);
  // arms
  const ar=sit?0:-sw*.8;
  if(sit){
    const sip=Math.max(0,Math.sin(tm*.9+c.id*2)-.55)/.45;
    ln(-7.5,ty+3,-9,-5,coat,4.6);ln(7.5,ty+3,9-sip*3,-5-sip*15,coat,4.6);
    g.fillStyle=skin;g.beginPath();g.arc(-9,-5,2.3,0,7);g.arc(9-sip*3,-5-sip*15,2.3,0,7);g.fill();
  }else{
    ln(-7.6,ty+3,-9.5-ar*.2,ty+12+ar*.5,coat,4.6);ln(7.6,ty+3,9.5+ar*.2,ty+12-ar*.5,coat,4.6);
    g.fillStyle=skin;g.beginPath();g.arc(-9.5-ar*.2,ty+12.5+ar*.5,2.3,0,7);g.arc(9.5+ar*.2,ty+12.5-ar*.5,2.3,0,7);g.fill();
    if(c.drink)cup(9.5+ar*.2,ty+11-ar*.5,c.drink==='🧋');
  }
  // head
  g.translate(0,hy);
  g.fillStyle=skin;g.strokeStyle=dark;g.lineWidth=.9;g.beginPath();g.ellipse(0,0,8.2,8.8,0,0,7);g.fill();g.stroke();
  g.fillStyle=skin;g.beginPath();g.arc(-8.3,.8,1.9,0,7);g.arc(8.3,.8,1.9,0,7);g.fill();
  hairDo(hs,hairC);
  if(T==='tour'){g.fillStyle='#ead9aa';g.strokeStyle='#a98562';g.lineWidth=.8;g.beginPath();g.ellipse(0,-6.5,12.5,3.2,0,0,7);g.fill();g.stroke();g.beginPath();g.moveTo(-7.5,-6.5);g.quadraticCurveTo(-7,-14.5,0,-14.5);g.quadraticCurveTo(7,-14.5,7.5,-6.5);g.closePath();g.fill();g.stroke();ln(-7.3,-8.3,7.3,-8.3,'#6f8c65',1.6)}
  const mad=c.mad||q<.3;
  g.fillStyle='#ff8a7a';g.globalAlpha=.3;g.beginPath();g.ellipse(-5.2,3.6,2.3,1.4,0,0,7);g.ellipse(5.2,3.6,2.3,1.4,0,0,7);g.fill();g.globalAlpha=1;
  g.fillStyle='#3f2f28';g.beginPath();g.ellipse(-3.2,.6,1.15,1.6,0,0,7);g.ellipse(3.2,.6,1.15,1.6,0,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-2.8,0,.45,0,7);g.arc(3.6,0,.45,0,7);g.fill();
  ln(-5,-2.6,-1.6,mad?-3.6:-3,'#4a382f',.9);ln(5,-2.6,1.6,mad?-3.6:-3,'#4a382f',.9);
  g.strokeStyle='#a75f53';g.lineWidth=.9;g.lineCap='round';g.beginPath();
  if(mad){g.moveTo(-2,5.6);g.quadraticCurveTo(0,4,2,5.6)}else if(sit||q>.55){g.arc(0,3.4,2.4,.2,Math.PI-.2)}else{g.moveTo(-1.8,5);g.lineTo(1.8,5)}
  g.stroke();
  if(T==='reg'){g.strokeStyle='#5b432e';g.lineWidth=.9;g.beginPath();g.arc(-3.4,.6,3,0,7);g.moveTo(6.4,.6);g.arc(3.4,.6,3,0,7);g.moveTo(-.4,.4);g.lineTo(.4,.4);g.stroke()}
  g.restore();
  if(c.mad){g.font='16px serif';g.fillStyle='#fff';g.fillText('💢',c.x+9,y-44)}
  if(c.st==='wait'){
    const p=Math.max(0,c.pat/c.pm);
    rr(c.x-15,y-52,30,7,3,'#fffdf7','#cbb89f');
    if(p>.03)rr(c.x-13,y-50,26*p,3,1.5,p>.6?'#8aa675':p>.3?'#e6b45d':'#cf7764');
    g.font='11px serif';g.fillStyle='#fff';g.fillText(TY[c.t].e,c.x+19,y-45);
    if(c.id==selId){g.font='bold 14px sans-serif';g.fillStyle='#b8734c';g.fillText('▼',c.x,y-62+Math.sin(tm*6)*2)}else{g.font='13px serif';g.fillText('💬',c.x,y-61)}
  }
}
function drawChair(i){
  const p=SEAT_POS[i],col=CUSH[i%3];
  g.save();g.translate(p.x,p.y+2);
  g.globalAlpha=.16;g.fillStyle='#5b432e';g.beginPath();g.ellipse(0,13,18,6,0,0,7);g.fill();g.globalAlpha=1;
  ln(-9,-5,-9,9,'#6d4a35',2.6);ln(9,-5,9,9,'#6d4a35',2.6);
  ln(-11,-38,-11,-6,'#8a5a3d',3);ln(11,-38,11,-6,'#8a5a3d',3);
  rr(-13,-40,26,5,2.2,'#a9704a','#7a4c33');rr(-11.5,-17,23,3.6,1.6,'#a9704a','#7a4c33');
  for(let k=-6;k<=6;k+=6)ln(k,-33,k,-19,'#c28a5e',2.4);
  g.fillStyle=col;g.strokeStyle='#4f4636';g.lineWidth=.9;g.beginPath();g.moveTo(-16,-3);g.lineTo(0,-10);g.lineTo(16,-3);g.lineTo(0,4);g.closePath();g.fill();g.stroke();
  g.fillStyle='#000';g.globalAlpha=.16;g.beginPath();g.moveTo(-16,-3);g.lineTo(0,4);g.lineTo(0,8);g.lineTo(-16,1);g.closePath();g.fill();g.globalAlpha=.28;g.beginPath();g.moveTo(16,-3);g.lineTo(0,4);g.lineTo(0,8);g.lineTo(16,1);g.closePath();g.fill();g.globalAlpha=1;
  ln(-15,1.5,-15,13,'#6d4a35',2.6);ln(15,1.5,15,13,'#6d4a35',2.6);ln(0,8,0,17,'#6d4a35',2.8);
  g.restore();
}
function drawTable(i){
  const p=SEAT_POS[i],x=p.x,y=p.y+10,occ=cs.find(c=>c.seat===i&&c.st==='sit');
  g.save();g.translate(x,y);
  g.globalAlpha=.18;g.fillStyle='#5b432e';g.beginPath();g.ellipse(0,26,30,10,0,0,7);g.fill();g.globalAlpha=1;
  g.fillStyle='#765039';g.fillRect(-2.6,16,5.2,17);g.fillStyle='#6b4a36';g.beginPath();g.ellipse(0,33,11,3.8,0,0,7);g.fill();
  g.strokeStyle='#765039';g.lineWidth=1;
  g.fillStyle='#9c6745';g.beginPath();g.moveTo(-25,0);g.lineTo(0,11.5);g.lineTo(0,17.5);g.lineTo(-25,6);g.closePath();g.fill();g.stroke();
  g.fillStyle='#b77a50';g.beginPath();g.moveTo(25,0);g.lineTo(0,11.5);g.lineTo(0,17.5);g.lineTo(25,6);g.closePath();g.fill();g.stroke();
  g.fillStyle='#dcab72';g.strokeStyle='#85593d';g.lineWidth=1.3;g.beginPath();g.moveTo(0,-11.5);g.lineTo(25,0);g.lineTo(0,11.5);g.lineTo(-25,0);g.closePath();g.fill();g.stroke();
  g.strokeStyle='#f2d5aa';g.lineWidth=1;g.beginPath();g.moveTo(-15,-1);g.lineTo(0,-7.5);g.lineTo(15,-1);g.stroke();
  // little props on every table: flower vase + napkin holder
  rr(-14,-4.5,3.4,4.6,1,'#eaf3ee','#86a395');ln(-12.3,-4.5,-12.3,-9,'#76906b',1);g.fillStyle='#ff8fa3';g.beginPath();g.arc(-12.3,-10,1.9,0,7);g.fill();
  rr(9,-2.6,6,3.4,1,'#d9c9ae','#a98562');
  if(occ){ // guest's drink + saucer
    g.fillStyle='#fffdf7';g.strokeStyle='#bfae92';g.lineWidth=.8;g.beginPath();g.ellipse(2,3,6.5,2.5,0,0,7);g.fill();g.stroke();
    cup(2,3.6,occ.drink==='🧋');
    if(occ.drink!=='🧋'){g.globalAlpha=.5;g.strokeStyle='#fff';g.lineWidth=1;for(let k=0;k<2;k++){const t=(tm*.7+k*.5)%1;g.beginPath();g.moveTo(1+k*2.5+Math.sin(t*7)*1.2,-5-t*8);g.lineTo(1+k*2.5+Math.sin(t*7+1)*1.2,-6-t*8);g.stroke()}g.globalAlpha=1}
  }
  g.restore();
}
function scene(){
  g.clearRect(0,0,360,240);g.textAlign='center';g.textBaseline='middle';
  const L=cs.map(c=>({y:c.y,f:()=>drawC(c)}));
  SEAT_POS.slice(0,NS()).forEach((p,i)=>{L.push({y:p.y-8,f:()=>drawChair(i)});L.push({y:p.y+10,f:()=>drawTable(i)})});
  L.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  g.font='16px serif';fx.forEach(f=>{f.t+=.033;g.globalAlpha=Math.max(0,1-f.t);g.fillText('💖',f.x,f.y-f.t*30)});g.globalAlpha=1;
  for(let i=fx.length-1;i>=0;i--)if(fx[i].t>=1)fx.splice(i,1);
}
let last=0;
function loop(t){
  requestAnimationFrame(loop);

$('cv').onpointerdown=e=>{

$('hb').onclick=()=>{hint=!hint;ls.set('c3h2',hint);flash(hint?'💡 中文提示：開':'💡 中文提示：關','#e69a00')};

document.addEventListener('visibilitychange',()=>{if(document.hidden&&run)show('<h1>⏸ 暫停</h1><button onclick="hideOv()">繼續</button>')});

syncShelf();menu();requestAnimationFrame(loop);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');

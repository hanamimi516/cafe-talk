<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<title>Café Talk 咖啡館</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f0f1e;color:#fff;font-family:system-ui,sans-serif}
#app{max-width:480px;min-height:100%;margin:0 auto;background:#1a1a2e;position:relative;padding-bottom:12px}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:bold;font-size:15px}
#top button{padding:4px 10px;font-size:16px}
#cust{margin:0 10px 8px;padding:8px 10px;background:#2a2a44;border-radius:14px}
#who{display:flex;align-items:center;gap:8px;font-size:14px}
#face{font-size:30px}
#bar{flex:1;height:10px;background:#0006;border-radius:5px;overflow:hidden}
#fill{height:100%}
#bub{margin-top:6px;font-size:17px;line-height:1.35;min-height:46px}
#hint{color:#9aa;font-size:12px;min-height:16px}
#pn{min-height:300px}
.row{display:flex;gap:4px;padding:0 10px 4px}
.o{flex:1;min-height:42px;font-size:12px;padding:3px 1px;border-radius:10px;background:#3b3b63;line-height:1.15;overflow:hidden}
.o small{display:block;font-size:10px;color:#bbb}
.o.on{background:#ff8a3d}.o.on small{color:#fff}
.row.bad .o.on{background:#e11d48}
#sv{display:block;width:calc(100% - 20px);margin:6px 10px 0}
button{border:0;border-radius:12px;background:#ff8a3d;color:#fff;font-size:20px;padding:12px 28px}
button.s{background:#3b3b63}
button:disabled{opacity:.4}
.b{font-size:16px;padding:6px 12px}
.ov{position:absolute;inset:0;background:#1a1a2ef7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;z-index:5;min-height:100%}
.ov.top{justify-content:flex-start}
.hide{display:none!important}
h1{margin:0;font-size:30px}
h3{margin:12px 0 4px;color:#ff8a3d;text-align:left;width:100%}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:6px 4px;border-bottom:1px solid #fff2;font-size:15px;text-align:left}
.w{width:100%}
small{color:#aab}
#fl{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:28px;font-weight:bold;pointer-events:none;text-shadow:0 2px 6px #000;z-index:9}
</style></head>
<body><div id="app">
<div id="top"><span id="d"></span><span id="t"></span><span id="c"></span><span><button class="s" id="hb">💡</button> <button class="s" id="sb">📖</button></span></div>
<div id="cust"><div id="who"><span id="face">🚶</span><span id="ty"></span><div id="bar"><div id="fill"></div></div></div><div id="bub"></div><div id="hint"></div></div>
<div id="pn"></div>
<button id="sv">✔ 出餐 Serve</button>
<div id="fl" class="hide"></div>
<div class="ov hide" id="ov"></div>
</div>
<script>
const W={
size:{S:['Small','小杯'],M:['Medium','中杯'],L:['Large','大杯']},
temp:{hot:['Hot','熱'],ice:['Iced','冰']},
drink:{ame:['Americano','美式'],lat:['Latte','拿鐵'],cap:['Cappuccino','卡布奇諾'],moc:['Mocha','摩卡'],mat:['Matcha latte','抹茶拿鐵']},
milk:{none:['No milk','不加奶'],whole:['Whole milk','全脂牛奶'],oat:['Oat milk','燕麥奶']},
ex:{shot:['Extra shot','多一份濃縮'],ice:['Less ice','少冰'],sug:['No sugar','無糖']},
food:{cro:['Croissant','可頌'],chz:['Cheesecake','起司蛋糕']},
for:{here:['For here','內用'],go:['To go','外帶']}};
const RN={size:'尺寸',temp:'冷熱',drink:'飲料',milk:'奶',ex:'加選',food:'餐點',for:'用餐'};
const BASE={ame:50,lat:65,cap:70,moc:80,mat:85};
const TY={tour:{n:'Tourist 觀光客',e:'🧳',p:26,m:1},rush:{n:'Rushed 趕時間',e:'🏃',p:14,m:1.15},reg:{n:'Regular 熟客',e:'🧓',p:22,m:1.25}};
const SHOP=[
{k:'beans',n:'Better beans 好咖啡豆',d:'所有飲料收入 +15%',c:[100,250,500]},
{k:'chairs',n:'Cozy chairs 舒適座椅',d:'客人耐心 +20%',c:[100,250,500]},
{k:'cap',n:'Cappuccino 卡布奇諾',d:'解鎖新飲料',c:[150]},
{k:'moc',n:'Mocha 摩卡',d:'解鎖新飲料',c:[250]},
{k:'mat',n:'Matcha latte 抹茶拿鐵',d:'解鎖新飲料',c:[300]},
{k:'oat',n:'Oat milk 燕麥奶',d:'解鎖燕麥奶選項',c:[150]},
{k:'ext',n:'Extras 加選項目',d:'解鎖 Extra shot / Less ice / No sugar',c:[200]},
{k:'pas',n:'Pastry case 甜點櫃',d:'解鎖 Croissant / Cheesecake',c:[250]}];
const PH=[['Hello! One large iced latte, to go, please.','你好！請給我一杯大杯冰拿鐵，外帶。'],['Could I get a latte with oat milk?','我可以點一杯燕麥奶拿鐵嗎？'],['No sugar, please.','請不要加糖。'],['For here or to go?','內用還是外帶？'],['Can I pay by card?','可以刷卡嗎？']];
const $=id=>document.getElementById(id),ov=$('ov');
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const D=ls.get('c2',{});
let C=D.C||0,S=D.S||{},day=D.day||1,best=D.best||0,hint=ls.get('c2h',true);
let T=90,cur=null,sel,pat=1,patMax=1,served=0,lost=0,dayC=0,miss={},bad=[],run=false,inDay=false,lastSum='';
const save=()=>ls.set('c2',{C,S,day,best});
const fresh=()=>({size:null,temp:null,drink:null,milk:'none',ex:[],food:[],for:'here'});
function avail(r){
  if(r=='drink')return['ame','lat'].concat(['cap','moc','mat'].filter(k=>S[k]));
  if(r=='milk')return['none','whole'].concat(S.oat?['oat']:[]);
  if(r=='ex')return S.ext?['shot','ice','sug']:[];
  if(r=='food')return S.pas?['cro','chz']:[];
  return Object.keys(W[r]);
}
function makeOrder(t){
  const dr=pick(avail('drink')),ice=Math.random()<.5;
  const o={size:pick(['S','M','L']),temp:ice?'ice':'hot',drink:dr,milk:dr=='ame'?'none':(S.oat&&Math.random()<.4?'oat':'whole'),ex:[],food:[],for:Math.random()<.5?'here':'go'};
  if(S.ext&&t!='tour'&&Math.random()<.5){
    const c=['sug'];if(dr!='mat')c.push('shot');if(ice)c.push('ice');
    o.ex=[pick(c)];
    if(t=='reg'&&Math.random()<.3){const r=c.filter(x=>x!=o.ex[0]);if(r.length)o.ex.push(pick(r))}
  }
  if(S.pas&&(t=='reg'?Math.random()<.6:Math.random()<.15))o.food=[pick(['cro','chz'])];
  return o;
}
function say(o,t){
  const lc=k=>W[k][o[k]][0].toLowerCase(),L=[];
  if(o.milk!='none')L.push(lc('milk'));
  const exm={shot:'an extra shot',ice:'less ice',sug:'no sugar'};o.ex.forEach(e=>L.push(exm[e]));
  const wi=L.length?' with '+(L.length>1?L.slice(0,-1).join(', ')+' and '+L[L.length-1]:L[0]):'';
  const core=`${lc('size')} ${lc('temp')} ${lc('drink')}${wi}`;
  const fd=o.food.map(f=>f=='cro'?'a croissant':'a slice of cheesecake')[0],fr=lc('for'),Cp=s=>s[0].toUpperCase()+s.slice(1);
  if(t=='tour')return pick(['Hello! One ','Hi, I would like a '])+core+', '+fr+', please.'+(fd?' And '+fd+'.':'');
  if(t=='rush')return Cp(core)+(fd?', and '+fd:'')+', '+fr+'. Thanks!';
  return 'Good morning! Could I get a '+core+(fd?', and '+fd:'')+'? '+Cp(fr)+', please.';
}
const zhOf=o=>[W.size[o.size][1]+W.temp[o.temp][1]+W.drink[o.drink][1]].concat(o.milk!='none'?[W.milk[o.milk][1]]:[],o.ex.map(e=>W.ex[e][1]),o.food.map(f=>W.food[f][1]),[W.for[o.for][1]]).join('・');
function diff(o,s){
  const b=[];
  ['size','temp','drink','milk','for'].forEach(k=>{if(o[k]!=s[k])b.push(k)});
  ['ex','food'].forEach(k=>{if([...o[k]].sort()+''!=[...s[k]].sort()+'')b.push(k)});
  return b;
}
function flash(s,c){const f=$('fl');f.textContent=s;f.style.color=c||'#fff';f.classList.remove('hide');clearTimeout(f.t);f.t=setTimeout(()=>f.classList.add('hide'),900)}
function show(h,top){run=false;scrollTo(0,0);ov.className='ov'+(top?' top':'');ov.innerHTML=h}
function hideOv(){ov.classList.add('hide');run=inDay}
function menu(){inDay=false;cur=null;draw();panel();show(`<h1>☕ Café Talk</h1><p>聽懂客人的英文點單<br>選對選項再出餐，賺錢升級咖啡館</p><div>🏆 最高天數 <b>${best}</b>　💰 存款 <b>${C}</b></div><button onclick="startDay()">開始 第 ${day} 天</button><button class="s" onclick="shop('menu()')">🛒 商店</button><button class="s" onclick="sheet('menu()')">📖 單字小抄</button><button class="s b" onclick="if(confirm('確定要清除所有存檔？')){localStorage.removeItem('c2');location.reload()}">🗑 重置存檔</button>`)}
function sheet(back){
  const rows=a=>a.map(([x,y])=>`<div class=r><span>${x}</span><span>${y}</span></div>`).join('');
  show('<h1>📖 單字小抄</h1><div class=w>'+Object.keys(RN).map(r=>`<h3>${RN[r]}</h3>`+rows(Object.values(W[r]))).join('')+'<h3>💬 常用句子</h3>'+rows(PH)+`</div><button style="margin:12px 0" onclick="${back}">返回</button>`,1);
}
function shop(back){
  show(`<h1>🛒 商店</h1><div>💰 <b>${C}</b></div><div class=w>`+SHOP.map(s=>{
    const l=S[s.k]||0,m=s.c.length,c=s.c[l];
    return `<div class=r><span><b>${s.n}</b>${m>1?' Lv'+l+'/'+m:''}<br><small>${s.d}</small></span>${l>=m?'<span>✔ 已滿</span>':`<button class="b" onclick="buy('${s.k}','${back}')" ${C<c?'disabled':''}>💰${c}</button>`}</div>`}).join('')+`</div><button class="s" style="margin:12px 0" onclick="${back}">返回</button>`,1);
}
function buy(k,back){const s=SHOP.find(x=>x.k==k),c=s.c[S[k]||0];if(C<c)return;C-=c;S[k]=(S[k]||0)+1;save();vib(30);shop(back)}
function startDay(){T=90;served=lost=dayC=0;miss={};inDay=true;hideOv();nextCust()}
function nextCust(){
  if(!inDay)return;
  const ts=['tour'];if(day>=2)ts.push('rush');if(day>=3)ts.push('reg');
  const t=pick(ts),o=makeOrder(t);
  cur={t,o,txt:say(o,t),zh:zhOf(o)};sel=fresh();bad=[];
  patMax=pat=TY[t].p*(1+.2*(S.chairs||0))*Math.max(.65,1-day*.04);
  draw();panel();
}
function serve(){
  if(!run||!cur)return;
  if(!sel.size||!sel.temp||!sel.drink)return flash('還沒選完喔','#fc6');
  const b=diff(cur.o,sel);
  if(!b.length){
    const o=cur.o;
    let p=BASE[o.drink]+{S:0,M:10,L:20}[o.size]+o.ex.length*10+o.food.length*40;
    p=Math.round(p*TY[cur.t].m*(1+.15*(S.beans||0))*(pat>patMax*.6?1.1:1));
    C+=p;dayC+=p;served++;save();vib(30);flash('✔ +'+p,'#4f4');
    cur=null;draw();panel();setTimeout(nextCust,600);
  }else{
    b.forEach(r=>{[].concat(cur.o[r]).forEach(v=>miss[r+':'+v]=1)});
    bad=b;pat-=patMax*.2;vib(100);flash('✘ 不對喔','#fa4');panel();
    setTimeout(()=>{bad=[];panel()},1200);
  }
}
function endDay(){
  inDay=false;cur=null;best=Math.max(best,day);const n=day;day++;save();
  const ms=Object.keys(miss).map(k=>{const[r,v]=k.split(':');return `<div class=r><span>${W[r][v][0]}</span><span>${W[r][v][1]}</span></div>`}).join('');
  lastSum=`<h1>第 ${n} 天結束</h1><div>服務 ${served} 位　離開 ${lost} 位</div><div>今日收入 💰 <b>${dayC}</b>　存款 💰 <b>${C}</b></div>${ms?'<h3>這天答錯的單字</h3><div class=w>'+ms+'</div>':''}<button onclick="startDay()">繼續 第 ${day} 天</button><button class="s" onclick="shop('sum()')">🛒 商店</button><button class="s" onclick="menu()">回選單</button>`;
  draw();panel();sum();
}
const sum=()=>show(lastSum,1);
function panel(){
  $('pn').innerHTML=cur?Object.keys(RN).map(r=>{
    const a=avail(r);if(!a.length)return'';
    return `<div class="row${bad.includes(r)?' bad':''}">`+a.map(v=>`<button class="o${(Array.isArray(sel[r])?sel[r].includes(v):sel[r]==v)?' on':''}" data-r="${r}" data-v="${v}">${W[r][v][0]}<small>${W[r][v][1]}</small></button>`).join('')+'</div>';
  }).join(''):'';
}
function draw(){
  $('d').textContent='第 '+day+' 天';$('t').textContent='⏱ '+Math.max(0,Math.ceil(T));$('c').textContent='💰 '+C;
  if(!cur){$('face').textContent='🚶';$('fill').style.width='0';$('ty').textContent='';$('bub').textContent='';$('hint').textContent='';return}
  const q=Math.max(0,pat/patMax);
  $('face').textContent=q>.6?'😀':q>.3?'😐':'😠';
  $('fill').style.width=q*100+'%';$('fill').style.background=q>.6?'#4ade80':q>.3?'#facc15':'#f87171';
  $('ty').textContent=TY[cur.t].e+' '+TY[cur.t].n;
  $('bub').textContent='“'+cur.txt+'”';
  $('hint').textContent=hint?'💡 '+cur.zh:'';
}
$('pn').onclick=e=>{
  const b=e.target.closest('.o');if(!b||!run||!cur)return;
  const r=b.dataset.r,v=b.dataset.v;
  if(Array.isArray(sel[r])){const i=sel[r].indexOf(v);i<0?sel[r].push(v):sel[r].splice(i,1)}else sel[r]=v;
  vib(8);panel();
};
$('sv').onclick=serve;
$('hb').onclick=()=>{hint=!hint;ls.set('c2h',hint);flash(hint?'💡 中文提示：開':'💡 中文提示：關','#ffd23d');draw()};
$('sb').onclick=()=>sheet('hideOv()');
setInterval(()=>{
  if(!run)return;
  T-=.1;
  if(cur){pat-=.1;if(pat<=0){lost++;cur=null;flash('😠 客人離開了','#f66');draw();panel();setTimeout(nextCust,700)}}
  if(T<=0)return endDay();
  draw();
},100);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run)show('<h1>⏸ 暫停</h1><button onclick="hideOv()">繼續</button>')});
menu();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
